# Alembic configuration.
#
# There is deliberately no `sqlalchemy.url` here: env.py reads the connection
# string from app.config.settings so credentials stay in .env and out of git.

[alembic]
script_location = %(here)s/alembic

# Date-prefixed filenames so `ls versions/` reads in apply order.
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# Lets env.py import `app.*` when alembic runs from backend/.
prepend_sys_path = .

path_separator = os


[post_write_hooks]
# Generated migrations go through the same formatter as the rest of the code.
hooks = ruff_format, ruff_check
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME
ruff_check.type = exec
ruff_check.executable = ruff
ruff_check.options = check --fix REVISION_SCRIPT_FILENAME


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
